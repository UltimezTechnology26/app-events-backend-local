<!DOCTYPE html>
<html lang="en">

<head>
    <title>Event Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Figtree", sans-serif;
        }

        .event-card {
            position: relative;
            width: 1280px;
            height: 680px;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(130deg, #011E9A 0%, #75316F 60%, #E94444 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .event-card-bg {
            content: "";
            width: 100%;
            height: 100%;
            position: absolute;
            object-fit: contain;
            object-position: top;
            top: 0;
            left: 0;
            background-repeat: repeat;
            background-size: contain;
        }

        .card-content {
            position: relative;
            z-index: 1;
            padding: 40px;
            height: 100%;
        }

        .attending-text {
            font-size: 30px;
            font-weight: 500;
            color: #ffffffbf;
            margin-bottom: 10px;
            text-align: left;
            margin-top: 0px;
        }

        .qr-container {
            position: absolute;
            top: 0px;
            right: 0px;
            background: #fff;
            border-radius: 0 0 0 30px;
            padding: 8px;
            z-index: 2;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            border-radius: 6px;
            display: block;
        }

        .event-title {
            font-weight: 700;
            text-transform: capitalize;
            line-height: 1.3;
            margin-top: 15px;
            width: 75%;
            min-height: 200px;
            margin-bottom: 0;
        }

        .event-venue {
            display: flex;
            align-items: center;
            margin: 20px 0;
            font-size: 36px;
            width: 80%;
        }

        .icon-circle {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }

        .icon-circle img {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            background: #00000038;
            padding: 15px;
            border-radius: 50px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
        }

        .info-heading {
            font-size: 30px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .info-text {
            font-size: 30px;
            font-weight: 400;
            line-height: 1.4;
            margin-top: 0;
        }

        .speakers {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .speakers img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 6px;
            object-fit: cover;
            margin-top: 10px;
        }

        .user-avatar {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 2;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .time_speaker_set {
            position: absolute;
            bottom: 30px;
            width: 70%;
        }

        .event-venue .venue-text {
            font-weight: 400;
            line-height: 1.5;
            font-size: 44px;
        }
    </style>
</head>
