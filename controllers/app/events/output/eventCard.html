<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Blockchain Innovation Summit 2025</title>
    <style>
        body {
            font-family: "Figtree", sans-serif;
        }

        .event-card {
            background: linear-gradient(130deg, #020a80 0%, #3d2385 60%, #ec485e 100%);
            position: relative;
            overflow: hidden;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .event-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                /* soft circular highlights */
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 75% 60%, rgba(255, 255, 255, 0.06) 0%, transparent 30%),

                /* 1st line set (diagonal) */
                repeating-linear-gradient(135deg,
                    rgba(255, 255, 255, 0.04) 0px,
                    rgba(255, 255, 255, 0.04) 1px,
                    transparent 1px,
                    transparent 60px),

                /* 2nd line set (opposite diagonal) */
                repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.04) 0px,
                    rgba(255, 255, 255, 0.04) 1px,
                    transparent 1px,
                    transparent 60px),

                /* 3rd line set (straight vertical/horizontal) */
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.04) 0px,
                    rgba(255, 255, 255, 0.04) 1px,
                    transparent 1px,
                    transparent 60px);
            z-index: 0;
        }

        .card-content {
            position: relative;
            z-index: 10;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .attending-text {
            font-size: 13px;
            color: #c0c0c0;
            margin-bottom: 8px;
            font-weight: 500;
            text-align: left;
            width: 50%;
        }

        .qr-container {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .qr-code {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            background: #fff;
            padding: 3px;
        }

        .event-title {
            font-size: 22px;
            font-weight: 600;
            text-transform: capitalize;
            line-height: 1.2;
            margin-top: 10px;
            width: 75%;
            min-height: 60px;
        }

        .event-venue {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 13px;
            width: 80%;
        }

        .icon-circle {
            background: rgba(0, 0, 0, 0.3);
            width: 30px;
            height: 30px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 80%;
        }

        .info-heading {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .info-text {
            font-size: 12px;
            font-weight: 300;
        }

        .speakers {
            display: flex;
            align-items: center;
        }

        .speakers img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 5px;
            object-fit: cover;
            border: 1px solid #fff;
        }

        .user-avatar {
            position: absolute;
            right: 15px;
            bottom: 15px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="event-card">
        <div class="card-content">
            <h3 class="attending-text">I AM ATTENDING TO</h3>

            <div class="qr-container">
                <img src="" alt="QR Code" class="qr-code" />
            </div>

            <h2 class="event-title">Blockchain Innovation Summit 2025</h2>

            <div class="event-venue">
                <div class="icon-circle">
                    <img src="https://image.coinpedia.org/static/common/location_blue.svg" alt="location" />
                </div>
                <span class="venue-text">Dubai Expo Center</span>
            </div>

            <div class="info-grid">
                <div class="info-block">
                    <h3 class="info-heading">Time</h3>
                    <p class="info-text">Oct 15, 2025, 10:00 AM</p>
                </div>
                <div class="info-block">
                    <h3 class="info-heading">Speakers</h3>
                    <div class="speakers">
                        <img src="https://via.placeholder.com/40" alt="Speaker" />
<img src="https://via.placeholder.com/40" alt="Speaker" />
<img src="https://via.placeholder.com/40" alt="Speaker" />
                    </div>
                </div>
            </div>

            <div class="user-avatar">
                <img src="https://via.placeholder.com/80" alt="User" title="John Doe" />
            </div>
        </div>
    </div>
</body>

</html>
